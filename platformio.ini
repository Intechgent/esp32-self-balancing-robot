[env:esp32doit-devkit-v1]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200

; Pinned to a known-good platform version: main.cpp uses the Arduino-ESP32
; core 2.x LEDC API (ledcSetup/ledcAttachPin), which core 3.x removed.

; No external IMU library: this module is an MPU6500 (WHO_AM_I = 0x70), which
; the Adafruit MPU6050 library rejects. We read the registers directly via Wire.

